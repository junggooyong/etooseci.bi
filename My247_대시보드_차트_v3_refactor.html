    :root {
      --primary: #1a73e8;
      --secondary: #34a853;
      --accent: #fbbc04;
      --danger: #ea4335;
      --purple: #9b59b6;
      --orange: #e67e22;
      --teal: #1abc9c;
      --bg: #f0f4f9;
      --card: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 18px 70px;
    }

    .topbar {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      position: sticky;
      top: 14px;
      z-index: 10;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .topbar-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--text-muted);
      align-items: center;
    }

    .date-badge {
      background: var(--primary);
      color: #fff;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 700;
    }

    .kpi-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    @media (max-width: 1100px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .kpi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
      border-top: 4px solid transparent;
    }

    .kpi-card.blue { border-top-color: var(--primary); }
    .kpi-card.green { border-top-color: var(--secondary); }
    .kpi-card.orange { border-top-color: var(--orange); }
    .kpi-card.purple { border-top-color: var(--purple); }
    .kpi-card.teal { border-top-color: var(--teal); }
    .kpi-card.red { border-top-color: var(--danger); }
    .kpi-card.yellow { border-top-color: var(--accent); }

    .kpi-label {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 26px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 6px;
    }

    .kpi-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      line-height: 1.4;
    }

    .section {
      margin-top: 22px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--primary);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .grid-1 { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (max-width: 1100px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
      overflow: hidden;
    }

    .chart-title {
      display: flex;
      gap: 8px;
      align-items: center;
      font-weight: 900;
      font-size: 13px;
      margin-bottom: 10px;
      color: var(--text);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }

    .chart-wrap {
      position: relative;
      height: 320px;
    }
    .chart-wrap.h220 { height: 220px; }
    .chart-wrap.h260 { height: 260px; }
    .chart-wrap.h360 { height: 360px; }
    .chart-wrap.h420 { height: 420px; }
    canvas { width: 100% !important; height: 100% !important; }

    .tabs {
      display: inline-flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .tab-btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 800;
      font-size: 12px;
    }

      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

      background: rgba(234,67,53,.06);
      color: #7f1d1d;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12.5px;
      font-weight: 700;
      margin-top: 12px;
      line-height: 1.5;

  </style>
</head>

    const range = { start: '2026-03-03', end: '2026-04-03' };

    function parseDateStr(s) {
      const [y, m, d] = s.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function formatDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }
    function dateRangeInclusive(startStr, endStr) {
      const out = [];
      const s = parseDateStr(startStr);
      const e = parseDateStr(endStr);
      for (let cur = new Date(s.getTime()); cur <= e; cur.setDate(cur.getDate() + 1)) {
        out.push(formatDate(cur));
      }
      return out;
    }

    const ALL_DATES = dateRangeInclusive(range.start, range.end);

    function alignSeriesToRange(series, dateKey, valueKey, fillValue = 0) {
      const map = new Map(series.map(x => [x[dateKey], x[valueKey]]));
      return ALL_DATES.map(d => (map.has(d) ? map.get(d) : fillValue));
    }

    function missingDates(series, dateKey) {
      const set = new Set(series.map(x => x[dateKey]));
      return ALL_DATES.filter(d => !set.has(d));

    // KPI/정합성 요약(스타일 개선: 하드코딩 제거 + 경고 영역 표시)
    const rangeDays = ALL_DATES.length;
    document.getElementById('rangeText').textContent = range.start.replaceAll('-', '.') + ' ~ ' + range.end.replaceAll('-', '.');
    document.getElementById('daysBadge').textContent = rangeDays + '일';

    const kpiHoursSub = document.getElementById('kpiHoursSub');
    const kpiBranchTotal = DATA.branch_downloads.reduce((a,b)=>a+b.count, 0);
    document.getElementById('kpiBranchDlTotal').textContent = kpiBranchTotal.toLocaleString();

    document.getElementById('kpiTotalHours').textContent = DATA.kpi.total_hours.toLocaleString();
    document.getElementById('kpiTotalStudents').textContent = DATA.kpi.total_students.toLocaleString();
    document.getElementById('kpiTotalLoginUsers').textContent = DATA.kpi.total_login_users.toLocaleString();
    document.getElementById('kpiBranchDlSub').textContent = '차트 합산: ' + kpiBranchTotal.toLocaleString() + '건';

    const chartHoursSum = DATA.daily_study.reduce((a, d) => a + d.hours, 0);
    kpiHoursSub.textContent = '차트(일별) 합산: ' + chartHoursSum.toFixed(1).toLocaleString() + 'h (누락 일자는 0으로 채움)';

    const missDailyStudy = missingDates(DATA.daily_study, 'date');
    const missLoginDaily = missingDates(DATA.login_daily, 'date');
    const missAttendDaily = missingDates(DATA.attend_daily, 'date');
    const missIos = missingDates(DATA.ios_daily_dl, 'date');
    const missAndroid = missingDates(DATA.android_daily_new, 'date');

    const warningsEl = document.getElementById('warnings');
    const warnLines = [];
    function pushWarnIf(arr, label, limit = 4) {
      if (!arr.length) return;
      const shown = arr.slice(0, limit).join(', ');
      const more = arr.length > limit ? (' 외 ' + (arr.length - limit) + '일') : '';
      warnLines.push(`${label}: 누락일 ${arr.length}개 (예: ${shown}${more})`);
    }
    pushWarnIf(missDailyStudy, '순공시간', 4);
    pushWarnIf(missLoginDaily, '로그인', 4);
    pushWarnIf(missAttendDaily, '출결변경', 4);
    pushWarnIf(missIos, 'iOS 다운로드', 3);
    pushWarnIf(missAndroid, 'Android 신규 설치', 3);

    if (warnLines.length) {
      warningsEl.style.display = 'block';
      warningsEl.innerHTML = '주의: 아래 시계열은 제공된 데이터에 누락일이 있어, v3에서는 `0`으로 자동 채워서 시각적 구간이 끊기지 않게 했습니다.<br><br>' + warnLines.join('<br>');
    }

    // 날짜 라벨(스타일 개선: 월/일만 출력)
    function fmtDateLabel(dStr) {
      // 2026-03-03 -> 3/3
      const [, m, day] = dStr.split('-');
      return Number(m) + '/' + Number(day);
    }
    const labels = ALL_DATES.map(fmtDateLabel);

    // 1) Daily Study
    const dailyHours = alignSeriesToRange(DATA.daily_study, 'date', 'hours', 0);
    const dailyStudents = alignSeriesToRange(DATA.daily_study, 'date', 'students', 0);

    let dailyStudyChart = new Chart(document.getElementById('dailyStudyChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: '순공시간(h)',
          data: dailyHours,
          borderColor: '#1a73e8',
          backgroundColor: '#1a73e822',
          borderWidth: 2,
          pointRadius: 3,
          pointHoverRadius: 5,
          tension: 0.35,
          fill: true
        }]
      },
      options: {
        ...defaults,
        plugins: { ...defaults.plugins, legend: { display: false } },
        scales: {
          x: { ...scaleDefaults, ticks: { ...scaleDefaults.ticks, maxRotation: 45, minRotation: 30 } },
          y: { ...scaleDefaults }
        }
      }
    });

    function switchDailyStudy(mode, btn) {
      const tabs = btn && btn.parentElement;
      if (tabs) tabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      const ds = dailyStudyChart.data.datasets[0];
      if (mode === 'hours') {
        ds.label = '순공시간(h)';
        ds.data = dailyHours;
        ds.borderColor = '#1a73e8';
        ds.backgroundColor = '#1a73e822';
      } else {
        ds.label = '참여 학생수(명)';
        ds.data = dailyStudents;
        ds.borderColor = '#34a853';
        ds.backgroundColor = '#34a85322';
      }
      dailyStudyChart.update();
    }

    // 2) Login Daily (stacked bar)
    const loginStudent = alignSeriesToRange(DATA.login_daily, 'date', 'student', 0);
    const loginGuardian = alignSeriesToRange(DATA.login_daily, 'date', 'guardian', 0);

    new Chart(document.getElementById('loginDailyChart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: '학생', data: loginStudent, backgroundColor: '#1a73e8bb', borderRadius: 2, datalabels: DL_BAR(v => v.toLocaleString()) },
          { label: '학부모', data: loginGuardian, backgroundColor: '#34a853bb', borderRadius: 2, datalabels: DL_BAR(v => v.toLocaleString()) }
        ]
      },
      options: {
        ...defaults,
        scales: {
          x: { ...scaleDefaults, stacked: true, ticks: { ...scaleDefaults.ticks, maxRotation: 45 } },
          y: { ...scaleDefaults, stacked: true }
        },
        plugins: { ...defaults.plugins, legend: { position: 'bottom' } }
      }
    });

    // 3) Attend Daily
    const attendDaily = alignSeriesToRange(DATA.attend_daily, 'date', 'count', 0);
    new Chart(document.getElementById('attendDailyChart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: '신청 건수',
          data: attendDaily,
          backgroundColor: '#fbbc04bb',
          borderRadius: 3,
          datalabels: DL_BAR(v => v.toLocaleString())
        }]
      },
      options: {
        ...defaults,
        plugins: { ...defaults.plugins, legend: { display: false } },
        scales: { x: { ...scaleDefaults, ticks: { ...scaleDefaults.ticks, maxRotation: 45 } }, y: { ...scaleDefaults } }
      }
    });

    // 4) Download compare (no hard-coded date list)
    const iosDl = alignSeriesToRange(DATA.ios_daily_dl, 'date', 'count', 0);
    const andNew = alignSeriesToRange(DATA.android_daily_new, 'date', 'count', 0);

    let dlCompareChart = new Chart(document.getElementById('dlCompareChart'), {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label: 'iOS 다운로드', data: iosDl, backgroundColor: '#1a73e8bb', borderRadius: 2, datalabels: DL_BAR(v => v.toLocaleString()) },
          { label: 'Android 신규', data: andNew, backgroundColor: '#34a853bb', borderRadius: 2, datalabels: DL_BAR(v => v.toLocaleString()) }
        ]
      },
      options: {
        ...defaults,
        plugins: { ...defaults.plugins, legend: { position: 'bottom' } },
        scales: {
          x: { ...scaleDefaults, ticks: { ...scaleDefaults.ticks, maxRotation: 45 } },
          y: { ...scaleDefaults }
        }
      }
    });

    function switchDlTab(mode, btn) {
      document.querySelectorAll('#dlTabBtns .tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      dlCompareChart.data.datasets[0].hidden = (mode === 'android');
      dlCompareChart.data.datasets[1].hidden = (mode === 'ios');
      dlCompareChart.update();
    }

    // 5) Branch download bar (horizontal)
    const branchLabels = DATA.branch_downloads.map(d => d.branch);
    const branchCounts = DATA.branch_downloads.map(d => d.count);
    new Chart(document.getElementById('branchDlChart'), {
      type: 'bar',
      data: {
        labels: branchLabels,
        datasets: [{
          label: '다운로드수',
          data: branchCounts,
          backgroundColor: branchCounts.map((_, i) => (COLORS[i % COLORS.length] + 'cc')),
          borderColor: branchCounts.map((_, i) => COLORS[i % COLORS.length]),
          borderWidth: 1,
          borderRadius: 3,
          barThickness: 14,
          datalabels: DL_BAR(v => v.toLocaleString())
        }]
      },
      options: {
        ...defaults,
        indexAxis: 'y',
        plugins: { ...defaults.plugins, legend: { display: false } },
        layout: { padding: { right: 25 } },
        scales: {
          x: { ...scaleDefaults },
          y: { ...scaleDefaults, ticks: { ...scaleDefaults.ticks, font: { ...scaleDefaults.ticks.font, size: 11 } } }
        }
      }
    });
  </script>
